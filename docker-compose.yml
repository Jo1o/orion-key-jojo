version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:18-alpine
    container_name: orion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_secure_password_here}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./apps/api/src/main/resources/data.sql:/docker-entrypoint-initdb.d/01-data.sql
      - ./apps/api/src/main/resources/tghao_migration.sql:/docker-entrypoint-initdb.d/02-tghao.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端 API
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: orion-api
    restart: unless-stopped
    environment:
      # 数据库配置
      DB_URL: jdbc:postgresql://postgres:5432/db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-your_secure_password_here}

      # JWT 配置
      JWT_SECRET: ${JWT_SECRET:-orion-key-production-secret-key-must-be-at-least-256-bits-long-change-this}

      # 密码模式（生产环境使用 BCrypt）
      PASSWORD_PLAIN: "false"

      # 上传配置
      UPLOAD_PATH: /app/uploads
      UPLOAD_URL_PREFIX: /api/uploads

      # 邮件配置
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.example.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-noreply@jojobuy.top}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SITE_URL: https://jojobuy.top

      # Tghao 配置
      TGHAO_ENABLED: ${TGHAO_ENABLED:-true}
      TGHAO_BASE_URL: ${TGHAO_BASE_URL:-https://tghao.uk}
      TGHAO_APP_ID: ${TGHAO_APP_ID:-}
      TGHAO_APP_KEY: ${TGHAO_APP_KEY:-}

      # 受信代理（Nginx）
      RATE_LIMIT_TRUSTED_PROXIES: "127.0.0.1,::1,172.16.0.0/12,10.0.0.0/8"

      # Turnstile (Cloudflare 人机验证)
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    volumes:
      - upload_data:/app/uploads
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8083/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 前端 Web
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: orion-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://jojobuy.top/api
    ports:
      - "3000:3000"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: orion-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - web
      - api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  upload_data:
    driver: local
  nginx_cache:
    driver: local

networks:
  default:
    name: orion-network
